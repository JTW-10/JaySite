<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <title>Form Page</title>
        <link rel="shortcut icon" href="images/favicon.ico">
        <link rel="stylesheet" href="styles/main.css">
    </head>
    <body>
        <nav class="topbar">
            <a href="index.html"><img class="jaylogo" src="images/jay.png" alt="A crude drawing of a smiley face and the name JTW10."></a>
            <div class="links">
                <a href="gallery.html">Gallery</a>

        <main>
            <p>Got any game, movie, or comic suggestions? Tell me about them below:</p>

            <form class="mediaForm">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username">

                <label for="suggestion">Suggestion:</label>
                <input type="text" id="suggestion" name="suggestion">

                <label for="media">Media Type (e.g. game, movie, comic):</label>
                <input type="text" id="media" name="media">

                <div class="button">
                    <input type="submit" value="Send!">
                </div>
            </form>
        </main>
    </body>
